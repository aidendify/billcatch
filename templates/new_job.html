{% extends "base.html" %}
{% block title %}New job — BillCatch{% endblock %}
{% block content %}
<div class="page-head">
  <p class="crumb"><a href="{{ url_for('index') }}">Dashboard</a> / New job</p>
  <h1>New job</h1>
  <p class="lede">Pick a trade template. Checklist extras snapshot onto the job.</p>
</div>

<section class="card">
  {% if errors %}
  <ul class="flashes">
    {% for e in errors %}<li class="flash flash-error">{{ e }}</li>{% endfor %}
  </ul>
  {% endif %}
  <form method="post" class="stack">
    <label>Customer name *
      <input name="customer_name" required value="{{ (form.customer_name if form else '') }}">
    </label>
    <label>Customer email
      <input type="email" name="customer_email" value="{{ (form.customer_email if form else '') }}">
    </label>
    <label>Customer phone
      <input name="customer_phone" value="{{ (form.customer_phone if form else '') }}">
    </label>
    <label>Trade template *
      <select name="trade_template" required>
        <option value="">Select…</option>
        {% for key, tmpl in templates.items() %}
        <option value="{{ key }}" {% if form and form.trade_template == key %}selected{% endif %}>{{ tmpl.label }}</option>
        {% endfor %}
      </select>
    </label>
    <label>Job ref
      <input name="job_ref" value="{{ (form.job_ref if form else '') }}">
    </label>
    <label>Title
      <input name="title" value="{{ (form.title if form else '') }}">
    </label>
    <label>Site label
      <input name="site_label" value="{{ (form.site_label if form else '') }}">
    </label>
    <label>Notes (internal)
      <textarea name="notes" rows="3">{{ (form.notes if form else '') }}</textarea>
    </label>
    <div class="btn-row">
      <button class="btn" type="submit">Create job</button>
      <a class="btn btn-quiet" href="{{ url_for('index') }}">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
